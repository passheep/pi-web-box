name: Release

# 推送 v 开头的 tag 时自动构建便携版 EXE 并发布到 GitHub Releases。
# 也可以在 Actions 页面手动触发，此时只构建并上传 artifact，不创建 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# electron-builder 需要 contents: write 才能创建 Release 并上传资产。
permissions:
  contents: write

# 覆盖项目 .npmrc 里的国内镜像：GitHub runner 在境外，官方源更快。
env:
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

jobs:
  release:
    name: 构建并发布便携版
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      # electron-builder 用 package.json 的 version 作为 Release 的 tag，
      # 与推送的 tag 不一致会发布到错误的 tag 上，所以这里提前拦截。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "tag $tag 与 package.json 中的版本 v$version 不一致：请先更新 package.json 的 version 并提交，再重新打 tag。"
          }
          Write-Host "版本校验通过：$tag"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生成图标资源并编译
        run: npm run build

      # GitHub 的 runner 在境外，走官方源下载 Electron 比项目 .npmrc 里的国内镜像更快。
      # 注意必须用 npm_config_electron_mirror：@electron/get 读取镜像地址时，
      # npm_config_electron_mirror（来自 .npmrc）的优先级高于 ELECTRON_MIRROR，
      # 只写后者会被项目 .npmrc 覆盖掉。这里用环境变量形式在 job 级统一下发，
      # 环境变量的优先级高于 .npmrc，npm ci 和打包两步都会生效。
      # 只构建安装包：便携版体积与安装包接近，两者同时发布用户反而难以选择。
      - name: 打包安装包并发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 把构建与上传日志同时写入文件，便于发布异常时回溯问题。
          npx electron-builder --win nsis --publish always 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 退出码 $LASTEXITCODE" }
          Write-Host "打包与发布命令执行完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder 复用已有 release 时不会恢复发布状态（例如 tag 被重推后原 Release
      # 会变成草稿），导致资产上传成功但外面看不到。这里统一确认一次并解除草稿。
      # 注意：GitHub 的 releases/tags/{tag} 对草稿返回 404，必须从列表里按 tag 找。
      - name: 确保 Release 已正式发布
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = '${{ github.ref_name }}'
          $headers = @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "User-Agent"  = "pi-web-box"
            Accept        = "application/vnd.github+json"
          }
          $raw = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" -Headers $headers
          $all = @()
          $raw | ForEach-Object { $all += $_ }
          $target = $all | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $target) {
            Write-Host "::error title=ReleaseMissing::$tag 对应的 Release 不存在，无法发布"
            exit 0
          }
          if ($target.draft) {
            Write-Host "检测到草稿 Release（id=$($target.id)），正在转为正式发布…"
            $payload = @{ draft = $false; prerelease = $false } | ConvertTo-Json
            $updated = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/$($target.id)" `
              -Method Patch -Headers $headers -Body $payload -ContentType "application/json"
            Write-Host "已转为正式发布，published_at=$($updated.published_at)"
          } else {
            Write-Host "Release 已是正式发布状态，无需处理"
          }

      # electron-builder 在少数情况下会静默跳过上传而不报错（如判定 release 已存在）。
      # 这里用带 token 的 API 复查，并把诊断写成 workflow 注解（匿名可读）方便回溯。
      - name: 校验 Release 资产是否完整
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $headers = @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "User-Agent"  = "pi-web-box"
            Accept        = "application/vnd.github+json"
          }

          # 用注解输出诊断：注解在 check-runs API 里匿名可读。
          function Emit-Note([string]$level, [string]$title, [string]$text) {
            $oneLine = ($text -replace "[\r\n]+", " | ")
            if ($oneLine.Length -gt 1500) { $oneLine = $oneLine.Substring(0, 1500) }
            Write-Host "::$level title=$title::$oneLine"
          }

          # PowerShell 5.1 的 Invoke-RestMethod 会把 JSON 数组当成单个对象返回，
          # 直接接 @() 会变成「数组套数组」，后续会把整个列表误认为一个 Release。
          $raw = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" -Headers $headers
          $all = @()
          $raw | ForEach-Object { $all += $_ }
          $snapshot = ($all | ForEach-Object {
            $n = @($_.assets | ForEach-Object { $_.name }) -join ","
            "tag=$($_.tag_name) draft=$($_.draft) pub=$($_.published_at) assets[$n]"
          }) -join " || "
          Emit-Note "warning" "ReleaseList" $snapshot

          if (Test-Path publish.log) {
            $tail = (Get-Content publish.log | Select-Object -Last 25) -join " | "
            Emit-Note "warning" "PublishLog" $tail
          } else {
            Emit-Note "warning" "PublishLog" "（未生成 publish.log）"
          }

          try {
            $mine = $all | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
            if (-not $mine) { throw "列表中没有任何 $tag 的 Release" }
            $release = $mine
          } catch {
            Emit-Note "error" "ReleaseMissing" "找不到 tag $tag 对应的 Release：$($_.Exception.Message)"
            throw "未创建 Release $tag"
          }
          Write-Host "Release: name=$($release.name) draft=$($release.draft) prerelease=$($release.prerelease)"
          $names = @($release.assets | ForEach-Object { $_.name })
          Emit-Note "warning" "ReleaseAssets" "draft=$($release.draft) assets[$($names -join ',')]"
          $missing = @()
          if (-not ($names -contains "latest.yml")) { $missing += "latest.yml" }
          if (-not ($names -contains "Pi-Web-Box-Setup-$($release.tag_name.TrimStart('v')).exe")) { $missing += "安装包 EXE" }
          if ($missing.Count -gt 0) {
            Emit-Note "error" "ReleaseIncomplete" "缺少：$($missing -join '、')"
            throw "Release 资产不完整，缺少：$($missing -join '、')"
          }
          Write-Host "Release 资产校验通过"

      # 无论成功失败都保留发布日志，便于回溯上传失败的具体原因。
      - name: 上传发布日志
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log
          if-no-files-found: ignore

      # 手动触发时必须显式 --publish never：electron-builder 在 CI 环境下
      # 会隐式启用 onTagOrDraft 发布策略，没有 token 会直接报错。
      - name: 打包安装包（不发布）
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win nsis --publish never

      - name: 上传手动构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Web-Box-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error