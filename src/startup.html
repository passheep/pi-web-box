<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Web Box</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; color: #202124; background: #f7f8fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(560px, calc(100vw - 48px)); text-align: center; }
    .logo { width: 72px; height: 72px; margin-bottom: 22px; }
    h1 { font-size: 23px; font-weight: 650; margin: 0 0 10px; }
    p { color: #68707b; margin: 0; font-size: 14px; }
    .progress { position: relative; width: min(420px, 100%); height: 6px; margin: 26px auto 0; overflow: hidden; border-radius: 3px; background: #dfe3e8; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: #202124; transition: width .2s ease; }
    .progress.indeterminate .progress-bar { animation: progress 1.2s ease-in-out infinite; }
    pre { width: min(520px, 100%); max-height: 180px; box-sizing: border-box; margin: 18px auto 0; padding: 12px; overflow: auto; border: 1px solid #e2e5e9; border-radius: 8px; background: #fff; color: #4b5563; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 Consolas, monospace; }
    pre[hidden] { display: none; }
    .actions { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; }
    button { border: 1px solid transparent; border-radius: 7px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; background: #202124; color: #fff; }
    button:hover { filter: brightness(1.1); }
    button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    button.secondary { background: transparent; border-color: #d4d4d8; color: #4b5563; }
    .hint { font-size: 12px; color: #68707b; }
    @media (prefers-color-scheme: dark) {
      :root { color: #f4f4f5; background: #18181b; }
      p { color: #a1a1aa; }
      .progress { background: #3f3f46; }
      .progress-bar { background: #fafafa; }
      pre { border-color: #3f3f46; background: #27272a; color: #d4d4d8; }
      button { background: #fafafa; color: #18181b; }
      button.secondary { background: transparent; border-color: #3f3f46; color: #d4d4d8; }
      .hint { color: #a1a1aa; }
    }
    @keyframes progress {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(95%); }
      100% { transform: translateX(310%); }
    }
  </style>
</head>
<body><main>
  <picture>
    <source srcset="../assets/pi-logo-on-dark.svg" media="(prefers-color-scheme: dark)" />
    <img class="logo" src="../assets/pi-logo-on-light.svg" alt="Pi" />
  </picture>
  <h1 id="title">正在启动 Pi Web</h1>
  <p id="message">正在准备本地服务，请稍候…</p>
  <div id="progress" class="progress indeterminate" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="progress-bar" class="progress-bar"></div>
  </div>
  <pre id="detail" hidden></pre>
  <div class="actions">
    <button type="button" id="retry" hidden>重试</button>
    <button type="button" id="reset" class="secondary">重置配置</button>
    <span id="reset-hint" class="hint"></span>
  </div>
</main>
<script src="./startup-renderer.js"></script>
</body>
</html>
