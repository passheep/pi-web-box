<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Pi Web Box</title>
  <style>
    /* 桌面壳：顶部 40px 标签栏 + 消息面板，WebContentsView 由主进程覆盖在下方。 */
    :root {
      --bg: #ffffff;
      --bg-panel: #f5f5f5;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-muted: #515c6b;
      --accent: #245bce;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; color: inherit; }

    /* ── 标签栏 ── */
    #tabbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 40px;
      display: flex;
      align-items: stretch;
      gap: 2px;
      /* 顶部不留内边距：窗口按钮通栏全高，标签贴底对齐，避免整体下移的空隙。 */
      padding: 0 0 0 8px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      user-select: none;
    }
    #tabbar .tabs {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
    }
    .tabbar-spacer { flex: 1; min-width: 12px; }
    .bar-btn:disabled { opacity: .4; cursor: not-allowed; }
    .tab-dot {
      position: relative; width: 8px; height: 8px; flex: none;
      margin: 0 3px; border-radius: 50%; background: var(--tab-color);
    }
    .tab-dot.running::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 1.5px solid transparent; border-top-color: var(--tab-color);
      border-right-color: var(--tab-color); animation: tab-running 1.2s linear infinite;
    }
    @keyframes tab-running { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .tab-dot.running::after { animation: none; border-style: dotted; } }
    .tab {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 200px;
      min-width: 90px;
      height: 36px;
      padding: 0 8px 0 12px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      flex: 0 1 auto;
    }
    .tab:hover { background: var(--bg); }
    .tab.active {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text);
      font-weight: 500;
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .tab .tab-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .tab-close {
      flex: none;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      line-height: 0;
    }
    .tab .tab-close:hover { background: var(--border); color: var(--text); }
    .tab .tab-close:focus-visible { outline: 2px solid var(--accent); }
    .tab.dragging { opacity: 0.4; }
    .tab.drop-before { box-shadow: -2px 0 0 var(--accent); }

    /* 新建标签 / 消息 / 窗口按钮 */
    .bar-btn {
      -webkit-app-region: no-drag;
      flex: none;
      width: 30px;
      height: 30px;
      margin: 0 2px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      position: relative;
      /* 与 36px 高的标签垂直居中，不再整体下坠。 */
      align-self: center;
    }
    .bar-btn:hover { background: var(--bg); color: var(--text); }
    .bar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .bar-btn svg { width: 14px; height: 14px; }
    #messagesBtn .badge {
      position: absolute;
      top: 1px;
      right: 0;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 8px;
      background: #e81123;
      color: #fff;
      font-size: 10px;
      line-height: 15px;
      text-align: center;
      display: none;
    }
    #messagesBtn .badge.show { display: block; }
    #messagesBtn.active { background: var(--accent); color: #fff; }

    .window-buttons { display: flex; flex: none; margin-left: 2px; }
    .win-btn {
      -webkit-app-region: no-drag;
      width: 44px;
      height: 40px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .win-btn:hover { background: var(--border); color: var(--text); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
    .win-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .win-btn svg { width: 10px; height: 10px; }

    /* ── 消息面板：面板打开时主进程给右侧留 380px ── */
    #noticePanel {
      position: fixed;
      top: 40px;
      right: 0;
      bottom: 0;
      width: 380px;
      display: none;
      flex-direction: column;
      background: var(--bg);
      border-left: 1px solid var(--border);
    }
    #noticePanel.open { display: flex; }
    .notice-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .notice-header h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }
    #refreshNew {
      display: none;
      padding: 3px 10px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }
    #refreshNew.show { display: inline-block; }
    #refreshNew:hover { background: var(--accent); color: #fff; }
    #noticeList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 0;
    }
    .notice {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      cursor: default;
    }
    .notice.clickable { cursor: pointer; }
    .notice.clickable:hover { background: var(--bg-panel); }
    .notice .notice-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .notice .notice-session {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--accent);
    }
    .notice .notice-level {
      padding: 0 6px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      font-size: 10px;
    }
    .notice[data-level="error"] .notice-level { color: #e81123; border-color: #e81123; }
    .notice .notice-meta { flex-wrap: wrap; overflow-wrap: anywhere; }
    .notice.empty {
      text-align: center;
      color: var(--text-muted);
      border-bottom: none;
      padding: 24px 14px;
    }
    .notice .notice-text {
      word-break: break-word;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .notice.unread .notice-text { font-weight: 600; }
    #noticeStatus {
      flex: none;
      padding: 10px 14px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    #noticeStatus:empty { display: none; }
    #noticeStatus button {
      margin-left: 8px;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }
    #noticeStatus button:hover { border-color: var(--accent); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header id="tabbar">
    <div class="tabs" id="tabs" role="tablist" aria-label="会话标签"></div>
    <button class="bar-btn" id="newTabBtn" type="button" title="新建标签" aria-label="新建标签">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4" /></svg>
    </button>
    <div class="tabbar-spacer" aria-hidden="true"></div>
    <button class="bar-btn" id="messagesBtn" type="button" title="消息中心" aria-label="消息中心" aria-pressed="false">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 2.5h11v8h-6l-3 2.5v-2.5h-2z" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round" /></svg>
      <span class="badge" id="unreadBadge" aria-hidden="true"></span>
    </button>
    <div class="window-buttons">
      <button class="win-btn" id="winMin" type="button" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1" /></svg>
      </button>
      <button class="win-btn" id="winMax" type="button" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path id="winMaxIcon" d="M0.5 0.5h9v9h-9z" stroke="currentColor" stroke-width="1" fill="none" /></svg>
      </button>
      <button class="win-btn close" id="winClose" type="button" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" /></svg>
      </button>
    </div>
  </header>

  <section id="noticePanel" role="complementary" aria-label="消息中心">
    <div class="notice-header">
      <h2>消息中心</h2>
      <button id="refreshNew" type="button">有新消息，点击刷新</button>
    </div>
    <div id="noticeList" tabindex="0" role="log" aria-label="历史消息列表">
      <div id="noticeStatus" role="status"></div>
    </div>
  </section>

  <script src="./desktop-renderer.js"></script>
</body>
</html>
