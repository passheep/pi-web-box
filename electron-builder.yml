appId: com.piweb.box
productName: Pi Web Box
copyright: Copyright © Pi Web Box
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
asar: true
directories:
  output: dist
files:
  - build/**
  - assets/**
extraResources:
  - from: assets
    to: assets
  # 内置 pi 扩展：用户可在 Box 设置里一键安装到 pi 的扩展目录，
  # 用于记录 token 用量，使统计功能在任意机器上都能工作。
  # 只随包发布运行所需文件，自带测试不进入安装包。
  - from: extensions
    to: extensions
    filter:
      - "**/*"
      - "!**/*.test.ts"
win:
  target:
    # portable：单文件便携版，双击即用，无需安装。
    - target: portable
      arch:
        - x64
    # nsis：真正的安装包，向导式安装并注册卸载入口。
    - target: nsis
      arch:
        - x64
  icon: assets/pi-logo-adaptive.ico
  # 只保留实际会用到的 Electron 语言包：默认打包全部 55 个语言包，解包后约 46 MB，
  # 裁到英文和简体中文后不到 1.1 MB。由于 7z 对 .pak 压缩率很高，
  # 最终安装包体积大约减少 7 MB（88.6 MB -> 81.4 MB），解包后减少约 45 MB。
  electronLanguages:
    - en-US
    - zh-CN
portable:
  artifactName: Pi Web Box Portable-${version}.exe
  requestExecutionLevel: user
# NSIS 安装包：向导式安装，可自选安装目录，安装后写入开始菜单和桌面快捷方式，
# 并在“应用和功能”中注册卸载入口。perMachine 为 false 表示默认按当前用户安装，不需管理员权限。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pi Web Box
  artifactName: Pi Web Box Setup-${version}.exe
  # 安装界面只保留简体中文和英文，与本项目 electronLanguages 保持一致的裁剪思路。
  installerLanguages:
    - zh_CN
    - en_US
  deleteAppDataOnUninstall: false
# 发布目标：electron-builder 用 package.json 的 version 拼出 v 前缀 tag。
# releaseType 设为 release 表示 tag 推送后直接公开发布，改成 draft 则会先创建草稿。
publish:
  provider: github
  owner: passheep
  repo: pi-web-box
  releaseType: release
