appId: com.piweb.box
productName: Pi Web Box
copyright: Copyright © Pi Web Box
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
asar: true
directories:
  output: dist
files:
  - build/**
  - assets/**
extraResources:
  - from: assets
    to: assets
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/pi-logo-adaptive.ico
  # 只保留实际会用到的 Electron 语言包：默认打包全部 55 个语言包，解包后约 46 MB，
  # 裁到英文和简体中文后不到 1.1 MB。由于 7z 对 .pak 压缩率很高，
  # 最终安装包体积大约减少 7 MB（88.6 MB -> 81.4 MB），解包后减少约 45 MB。
  electronLanguages:
    - en-US
    - zh-CN
portable:
  artifactName: Pi Web Box Portable-${version}.exe
  requestExecutionLevel: user
# 发布目标：electron-builder 用 package.json 的 version 拼出 v 前缀 tag。
# releaseType 设为 release 表示 tag 推送后直接公开发布，改成 draft 则会先创建草稿。
publish:
  provider: github
  owner: passheep
  repo: pi-web-box
  releaseType: release
